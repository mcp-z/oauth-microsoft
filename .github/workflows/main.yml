name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_INCLUDE_MANUAL: 'false'

jobs:
  test:
    if: github.event_name == 'pull_request'
    name: Local PR tests / ${{ matrix.os }}
    concurrency:
      group: ci-pr-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          package-manager-cache: false
      - run: git config --global user.name "Github Actions"
      - run: git config --global user.email "actions@users.noreply.github.com"
      - run: npm ci
      - run: npm run prepublishOnly
      - run: npm test -- "test/exports/*.test.*" "test/unit/lib/*.test.ts" "test/unit/setup/*.test.ts"
      - run: npm run test:engines -- "test/exports/*.test.*" "test/unit/lib/*.test.ts" "test/unit/setup/*.test.ts"

  ubuntu:
    name: Full trusted tests / Ubuntu
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/live.yml
    with:
      runner: ubuntu-latest
    secrets: &live-secrets
      CI_SECRETS_TOKEN: ${{ secrets.CI_SECRETS_TOKEN }}
      TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
      TEST_REFRESH_TOKEN: ${{ secrets.TEST_REFRESH_TOKEN }}
      TEST_SCOPE: ${{ secrets.TEST_SCOPE }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      TEST_DEVICE_REFRESH_TOKEN: ${{ secrets.TEST_DEVICE_REFRESH_TOKEN }}
      TEST_DEVICE_SCOPE: ${{ secrets.TEST_DEVICE_SCOPE }}
      TEST_DCR_REFRESH_TOKEN: ${{ secrets.TEST_DCR_REFRESH_TOKEN }}
      TEST_DCR_SCOPE: ${{ secrets.TEST_DCR_SCOPE }}
      MS_TEST_DCR_CLIENT_ID: ${{ secrets.MS_TEST_DCR_CLIENT_ID }}
      MS_TEST_DCR_CLIENT_SECRET: ${{ secrets.MS_TEST_DCR_CLIENT_SECRET }}
      MS_TEST_DCR_TENANT_ID: ${{ secrets.MS_TEST_DCR_TENANT_ID }}
      TEST_DCR_CLIENT_ID: ${{ secrets.TEST_DCR_CLIENT_ID }}
      TEST_DCR_CLIENT_SECRET: ${{ secrets.TEST_DCR_CLIENT_SECRET }}

  windows:
    name: Full trusted tests / Windows
    needs: ubuntu
    uses: ./.github/workflows/live.yml
    with:
      runner: windows-latest
    secrets: *live-secrets
